/* ---------- Reveal (scroll animation) ---------- */
function Reveal({ children, delay = 0, className = '' }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const node = ref.current;
    if (!node) return;
    const observer = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) {
        setVisible(true);
        observer.disconnect();
      }
    }, { threshold: 0.15 });
    observer.observe(node);
    return () => observer.disconnect();
  }, []);

  return (
    <div ref={ref} className={`reveal ${visible ? 'is-visible' : ''} ${className}`} style={{ transitionDelay: visible ? `${delay}ms` : '0ms' }}>
      {children}
    </div>
  );
}

/* ---------- Hero ---------- */

    "coming-soon": { icon: "⏳", text: "Coming Soon", color: "#f59e0b" }

  return statusMap[status] || statusMap.available;
};

/* ---------- Gallery ---------- */
function Gallery({ listing }) {
  const photos = listing.photos || [];
  const hasPhotos = photos.length > 0;
  const [index, setIndex] = useState(0);
  const [lightboxOpen, setLightboxOpen] = useState(false);

  const goPrev = () => setIndex((i) => (i === 0 ? photos.length - 1 : i - 1));
  const goNext = () => setIndex((i) => (i === photos.length - 1 ? 0 : i + 1));

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (!lightboxOpen) return;
      if (e.key === 'Escape') setLightboxOpen(false);
      if (e.key === 'ArrowLeft') goPrev();
      if (e.key === 'ArrowRight') goNext();
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [lightboxOpen]);

  return (
    <section id="gallery" className="scroll-mt-20 px-4 py-14 md:px-8 md:py-20 lg:px-12 lg:py-24 bg-gray-50">
      <div className="max-w-4xl mx-auto">
        <Reveal>
          <span className="section-eyebrow text-xs sm:text-sm">Take a Look</span>
          <h2 className="text-xl sm:text-3xl md:text-4xl font-bold text-center text-gray-900 mb-3 sm:mb-4">Photos</h2>
          <div className="section-title-underline"></div>
        </Reveal>
        {hasPhotos ? (
          <Reveal delay={100}>
            <div className="relative">
              <div className="overflow-hidden rounded-2xl bg-black shadow-xl cursor-pointer group" onClick={() => setLightboxOpen(true)}>
                <img key={index} src={photos[index]} alt={`${listing.title} - photo ${index + 1} of ${photos.length}`} className="w-full h-72 md:h-[28rem] object-cover animate-fadein group-hover:scale-105 group-hover:opacity-90 transition-transform transition-opacity duration-300" loading="lazy" />
              </div>
              {photos.length > 1 && (
                <>
                  <button type="button" onClick={goPrev} aria-label="Previous photo"
                    className="absolute left-2 top-1/2 -translate-y-1/2 flex items-center justify-center h-11 w-11 rounded-full bg-white/90 hover:bg-white shadow-lg text-gray-800 transition-all hover:scale-110">
                    <svg className="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
                    </svg>
                  </button>
                  <button type="button" onClick={goNext} aria-label="Next photo"
                    className="absolute right-2 top-1/2 -translate-y-1/2 flex items-center justify-center h-11 w-11 rounded-full bg-white/90 hover:bg-white shadow-lg text-gray-800 transition-all hover:scale-110">
                    <svg className="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                    </svg>
                  </button>
                  <div className="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-2">
                    {photos.map((_, dotIdx) => (
                      <button key={dotIdx} type="button" onClick={() => setIndex(dotIdx)} aria-label={`Go to photo ${dotIdx + 1}`}
                        className={`h-2.5 rounded-full transition-all ${dotIdx === index ? 'bg-white w-6' : 'bg-white/50 w-2.5'}`} />
                    ))}
                  </div>
                </>
              )}
            </div>
          </Reveal>
        ) : (
          <Reveal delay={100}>

/* ---------- Calendar ---------- */
function CalendarMonth({ month, year, availableDates, checkIn, checkOut, onDateClick }) {
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const days = [];
  for (let i = 0; i < firstDay; i++) { days.push(null); }
  for (let day = 1; day <= daysInMonth; day++) { days.push(day); }
  const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  const isInRange = (day) => {
    if (!day || !checkIn || !checkOut) return false;
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const checkInDate = new Date(checkIn);
    const checkOutDate = new Date(checkOut);
    const currentDate = new Date(dateStr);
    return currentDate > checkInDate && currentDate < checkOutDate;
  };
  const isCheckInDate = (day) => {
    if (!day || !checkIn) return false;
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    return dateStr === checkIn;
  };
  const isCheckOutDate = (day) => {
    if (!day || !checkOut) return false;
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    return dateStr === checkOut;
  };

  const isPastDate = (day) => {
    if (!day) return false;
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const currentDate = new Date(dateStr);
    return currentDate < today;
  };

  return (
    <div className="bg-white dark:bg-slate-800 rounded-lg p-6 shadow-sm border border-gray-200 dark:border-slate-700">
      <h3 className="text-lg font-semibold text-gray-900 mb-4 text-center">{monthNames[month]} {year}</h3>
      <div className="grid grid-cols-7 gap-1 sm:gap-3">
        {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
          <div key={day} className="text-center text-sm font-semibold text-gray-500 py-2">{day}</div>
        ))}
        {days.map((day, idx) => {
          const dateStr = day ? `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}` : '';
          const past = isPastDate(day);
          const available = day && availableDates.includes(day) && !past;
          const inRange = isInRange(day);
          const isCheckIn = isCheckInDate(day);
          const isCheckOut = isCheckOutDate(day);
          return (
            <button
              key={idx}
              onClick={() => available && dateStr && onDateClick(dateStr)}
              disabled={!available || !day}
              style={{ userSelect: 'none', WebkitUserSelect: 'none' }}
              className={`aspect-square flex items-center justify-center text-xs font-medium rounded transition-colors select-none active:scale-95 focus:outline-none ${day === null ? '' : isCheckIn || isCheckOut ? 'bg-primary text-white shadow-md active:bg-primary focus:ring-2 focus:ring-primary focus:ring-offset-2' : inRange ? 'bg-primary-light text-primary active:bg-primary-light' : past ? 'bg-gray-100 text-gray-400 cursor-not-allowed opacity-60' : available ? 'bg-white border border-primary-light text-gray-900 hover:border-primary hover:bg-primary-light active:border-primary active:bg-primary-light cursor-pointer focus:ring-2 focus:ring-primary focus:ring-offset-2' : 'bg-gray-100 text-gray-400 cursor-not-allowed border border-gray-200'}`}
              title={past ? 'Date has passed' : !available && day ? 'Not available' : available && day ? 'Click to select' : ''}
            >
              {day}
            </button>
          );
        })}
      </div>
    </div>
  );
}
function Calendar({ onDatesSelected }) {
  const [checkIn, setCheckIn] = useState('');
  const [checkOut, setCheckOut] = useState('');
  const [displayMonth, setDisplayMonth] = useState(0);
  const [isMobile, setIsMobile] = useState(false);

  useEffect(() => {
    const checkMobile = () => setIsMobile(window.innerWidth < 768);
    checkMobile();
    window.addEventListener('resize', checkMobile);
    return () => window.removeEventListener('resize', checkMobile);
  }, []);

  const today = new Date();
  const currentMonth = today.getMonth();
  const currentYear = today.getFullYear();
  const sampleAvailable = {
    0: [5, 6, 7, 12, 13, 14, 19, 20, 21, 26, 27, 28],
    1: [2, 3, 4, 9, 10, 11, 16, 17, 18, 23, 24, 25],
    2: [1, 2, 3, 8, 9, 10, 15, 16, 17, 22, 23, 24, 29, 30],
  };

  const handleDateClick = (dateStr) => {
    if (dateStr === checkIn && dateStr === checkOut) {
      setCheckIn('');
      setCheckOut('');
    } else if (dateStr === checkIn) {
      setCheckIn('');
      setCheckOut('');
    } else if (dateStr === checkOut) {
      setCheckOut('');
    } else if (!checkIn) {
      setCheckIn(dateStr);
    } else if (!checkOut) {
      if (dateStr > checkIn) {
        setCheckOut(dateStr);
        if (onDatesSelected) {
          onDatesSelected(checkIn, dateStr);
        }
      } else {
        setCheckIn(dateStr);
        setCheckOut('');
      }
    } else {
      setCheckIn(dateStr);
      setCheckOut('');
    }
  };

  const nightsCount = checkIn && checkOut ? Math.floor((new Date(checkOut) - new Date(checkIn)) / (1000 * 60 * 60 * 24)) : 0;
  const totalPrice = nightsCount * 2500;

  return (
    <section id="availability" className="scroll-mt-20 px-4 py-14 md:px-8 md:py-20 lg:px-12 lg:py-24 bg-white">
      <div className="max-w-6xl mx-auto">
        <Reveal>
          <span className="section-eyebrow">Book Your Stay</span>
          <h2 className="text-3xl md:text-4xl font-bold text-center text-gray-900 mb-4">Availability Calendar</h2>
          <div className="section-title-underline"></div>
        </Reveal>
        <div className="mt-8 mb-8">
          <div className="flex items-center justify-center gap-3 sm:gap-6 mb-4">
            <button onClick={() => setDisplayMonth(Math.max(displayMonth - 3, -12))} disabled={displayMonth === -12} className="px-3 sm:px-4 py-2 border-2 border-primary text-primary dark:border-primary dark:text-primary rounded-lg hover:bg-primary hover:text-white dark:hover:bg-primary dark:hover:text-white disabled:border-gray-300 disabled:text-gray-400 dark:disabled:border-slate-600 dark:disabled:text-slate-500 transition-colors font-medium text-sm sm:text-base">← Prev</button>

            <button onClick={() => setDisplayMonth(Math.min(displayMonth + 3, 24))} disabled={displayMonth === 24} className="px-3 sm:px-4 py-2 border-2 border-primary text-primary dark:border-primary dark:text-primary rounded-lg hover:bg-primary hover:text-white dark:hover:bg-primary dark:hover:text-white disabled:border-gray-300 disabled:text-gray-400 dark:disabled:border-slate-600 dark:disabled:text-slate-500 transition-colors font-medium text-sm sm:text-base">Next →</button>
          </div>

          <div className="text-center min-h-[80px] flex flex-col items-center justify-center">
            <p className={`text-2xl sm:text-3xl font-bold transition-all duration-300 ${checkIn && totalPrice > 0 ? 'text-primary opacity-100 translate-y-0' : 'text-gray-400 dark:text-gray-600 opacity-100 translate-y-0'}`}>
              {checkIn && totalPrice > 0 ? `₱ ${totalPrice.toLocaleString()}` : 'Choose your stay'}
            </p>
            {checkIn && nightsCount > 0 && (
              <p className="text-xs sm:text-sm text-gray-600 dark:text-gray-400 transition-all duration-300 mt-2">
                {nightsCount} night{nightsCount !== 1 ? 's' : ''}
                {checkOut && ` • ${new Date(checkIn).toLocaleDateString()} → ${new Date(checkOut).toLocaleDateString()}`}
              </p>
            )}
          </div>
        </div>
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-2 sm:gap-6 mb-6">
          {Array.from({ length: isMobile ? 1 : 3 }).map((_, offset) => {
            const month = (currentMonth + offset + displayMonth) % 12;
            const year = currentYear + Math.floor((currentMonth + offset + displayMonth) / 12);
            const available = sampleAvailable[offset] || [];
            return (
              <Reveal key={offset} delay={offset * 100}>
                <CalendarMonth month={month} year={year} availableDates={available} checkIn={checkIn} checkOut={checkOut} onDateClick={handleDateClick} />
              </Reveal>
            );
          })}
        </div>
        <Reveal delay={300}>
          <div className="mt-8 bg-primary-light rounded-lg p-6 text-center border-2 border-primary dark:bg-slate-800 dark:border-slate-700">
            <p className="text-xs sm:text-sm text-gray-600 dark:text-gray-400 mb-4 pb-4 border-b border-primary/20 dark:border-slate-700">
              <span className="font-semibold text-gray-900 dark:text-white">Teal</span> = Available • <span className="font-semibold text-gray-900 dark:text-white">Filled</span> = Selected • <span className="font-semibold text-gray-900 dark:text-white">Faded</span> = Booked or Past
            </p>
            <h3 className="font-semibold text-gray-900 dark:text-white mb-2">How to book:</h3>
            <p className="text-gray-700 dark:text-gray-300 text-sm">1️⃣ Click check-in date • 2️⃣ Click check-out date • 3️⃣ Fill the form below with your selection</p>
            {checkIn && checkOut && (
              <p className="text-primary font-semibold mt-3">
                ✓ Dates selected! Scroll down to complete your inquiry.
              </p>
            )}
          </div>
        </Reveal>
      </div>
    </section>
  );
}

function SocialIcon({ platform, url }) {
  const icon = SOCIAL_ICONS[platform.toLowerCase()];
  if (!icon) {
    return <a href={url} target="_blank" rel="noopener noreferrer" className="text-primary hover:text-primary-dark capitalize">{platform}</a>;
  }
  return (
    <a href={url} target="_blank" rel="noopener noreferrer" aria-label={icon.label} title={icon.label}
      className="inline-flex items-center justify-center h-11 w-11 rounded-full transition-transform hover:scale-110" style={{ color: icon.color }}>
      <svg viewBox="0 0 24 24" fill="currentColor" className="h-full w-full">
        <path d={icon.path} />
      </svg>
    </a>
  );
}

function Contact({ listing, prefilledDates = {} }) {
  const [formData, setFormData] = useState({ name: '', contactInfo: '', question: '', checkIn: prefilledDates.checkIn || '', checkOut: prefilledDates.checkOut || '', guests: '' });
  const [submitted, setSubmitted] = useState(false);
  const { contact } = listing;
  const hasPhone = contact.phone && !contact.phone.startsWith("[OWNER");
  const hasEmail = contact.email && !contact.email.startsWith("[OWNER");
  const socialLinks = Object.entries(contact.socialMedia || {});

  const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });
  const handleSubmit = (e) => { e.preventDefault(); setSubmitted(true); };
  const copyEmail = () => { navigator.clipboard.writeText(contact.email); };
  const openGmail = () => {
    const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${contact.email}&subject=Inquiry%20About%20JH%20Listings%20Studio&body=Hello,%0A%0AI%20am%20interested%20in%20booking%20your%20studio%20condominium.%0A%0AThank%20you!`;
    window.open(gmailUrl, '_blank');
  };

  return (
    <section id="contact" className="scroll-mt-20 px-4 py-14 md:px-8 md:py-20 lg:px-12 lg:py-24 bg-white">
      <div className="max-w-5xl mx-auto">
        <Reveal>
          <span className="section-eyebrow">Reach Out</span>
          <h2 className="text-3xl md:text-4xl font-bold text-center text-gray-900 mb-4">Contact Us</h2>
          <div className="section-title-underline"></div>
        </Reveal>
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 lg:gap-12">
          <Reveal delay={100}>
            <div className="card-elevated p-4 sm:p-8 h-full">
              <h3 className="text-base sm:text-xl font-semibold text-gray-900 mb-4 sm:mb-6">Get in Touch</h3>
              <div className="space-y-4 mb-8">
                <div className="flex items-center gap-4"><span className="icon-circle">📞</span>{hasPhone ? <a href={`tel:${contact.phone.replace(/\\s/g, '')}`} className="text-primary hover:text-primary-dark font-medium transition-colors">{contact.phone}</a> : <span className="placeholder-text">{contact.phone}</span>}</div>
                <div className="flex items-center gap-4"><span className="icon-circle">✉️</span>{hasEmail ? <div className="flex items-center gap-2"><button onClick={openGmail} className="text-primary hover:text-primary-dark hover:underline font-medium transition-colors cursor-pointer bg-none border-none p-0" title="Send email via Gmail">{contact.email}</button><button onClick={copyEmail} className="text-gray-400 hover:text-primary transition-colors p-1" title="Copy email to clipboard"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg></button></div> : <span className="placeholder-text">{contact.email}</span>}</div>
              </div>
              <h4 className="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Social Media</h4>
              {socialLinks.length > 0 ? (
                <div className="flex gap-3">
                  {socialLinks.map(([platform, url]) => (
                    <SocialIcon key={platform} platform={platform} url={url} />
                  ))}
                </div>
              ) : (
                <p className="placeholder-text">[OWNER TO PROVIDE] — Social media links</p>
              )}
            </div>
          </Reveal>
          <Reveal delay={200}>
            <div className="card-elevated p-4 sm:p-8 h-full">
              <h3 className="text-base sm:text-xl font-semibold text-gray-900 mb-4 sm:mb-6">Send an Inquiry</h3>
              {submitted ? (
                <div className="bg-primary-light rounded-lg p-6 text-center">
                  <p className="text-primary-dark font-medium">Thank you! Your question has been recorded. We'll get back to you soon.</p>
                </div>
              ) : (
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label htmlFor="name" className="block text-sm font-medium text-gray-700 mb-1">Name <span className="text-accent">*</span></label>
                    <input type="text" id="name" name="name" required value={formData.name} onChange={handleChange} className="input-field" />
                  </div>
                  <div>
                    <label htmlFor="contactInfo" className="block text-sm font-medium text-gray-700 mb-1">Contact Information <span className="text-accent">*</span></label>
                    <input type="text" id="contactInfo" name="contactInfo" required placeholder="Email or phone number" value={formData.contactInfo} onChange={handleChange} className="input-field" />
                  </div>
                  <div>
                    <label htmlFor="question" className="block text-sm font-medium text-gray-700 mb-1">Question <span className="text-accent">*</span></label>
                    <textarea id="question" name="question" required rows={4} value={formData.question} onChange={handleChange} className="input-field"></textarea>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label htmlFor="checkIn" className="block text-sm font-medium text-gray-700 mb-1">Check-in date</label>
                      <input type="date" id="checkIn" name="checkIn" value={formData.checkIn} onChange={handleChange} className="input-field" />
                    </div>
                    <div>
                      <label htmlFor="checkOut" className="block text-sm font-medium text-gray-700 mb-1">Check-out date</label>
                      <input type="date" id="checkOut" name="checkOut" value={formData.checkOut} onChange={handleChange} className="input-field" />
                    </div>
                  </div>
                  <div>
                    <label htmlFor="guests" className="block text-sm font-medium text-gray-700 mb-1">Number of guests</label>
                    <input type="number" id="guests" name="guests" min="1" value={formData.guests} onChange={handleChange} className="input-field" />
                  </div>
                  <button type="submit" className="button-primary w-full">Send Question</button>
                </form>
              )}
            </div>
          </Reveal>
        </div>
      </div>
    </section>
  );
}

/* ---------- App ---------- */
function App() {
  const [activePage, setActivePage] = useState('hero');
  const [selectedDates, setSelectedDates] = useState({ checkIn: '', checkOut: '' });
  const [darkMode, setDarkMode] = useState(() => {
    const saved = localStorage.getItem('darkMode');
    if (saved !== null) return saved === 'true';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  });

  useEffect(() => {
    localStorage.setItem('darkMode', darkMode);
    document.documentElement.style.colorScheme = darkMode ? 'dark' : 'light';
  }, [darkMode]);

  const scrollToContact = () => {
    setActivePage('hero');
    setTimeout(() => {
      const element = document.getElementById('contact');
      if (element) {
        element.scrollIntoView({ behavior: 'smooth' });
      }
    }, 0);
  };

  const handleDatesSelected = (checkIn, checkOut) => {
    setSelectedDates({ checkIn, checkOut });
    setTimeout(() => {
      const element = document.getElementById('contact');
      if (element) {
        element.scrollIntoView({ behavior: 'smooth' });
      }
    }, 300);
  };

  useEffect(() => {
    window.scrollTo(0, 0);
  }, [activePage]);

  const scrollToSection = (sectionId) => {
    setActivePage('hero');
    setTimeout(() => {
      const element = document.getElementById(sectionId);
      if (element) {
        element.scrollIntoView({ behavior: 'smooth' });
      }
    }, 0);
  };

  const pages = {
    hero: () => <><Hero listing={listing} onAsk={scrollToContact} /><TheUnit listing={listing} /><Gallery listing={listing} /><Reviews /><Pricing listing={listing} /><Calendar onDatesSelected={handleDatesSelected} /><Location location={location} /><Contact listing={listing} prefilledDates={selectedDates} /></>,
    rules: () => <><Hero listing={listing} onAsk={scrollToContact} /><Rules listing={listing} /></>,
    faq: () => <><Hero listing={listing} onAsk={scrollToContact} /><FAQ /></>,
  };

  return (
    <div className={`min-h-screen transition-colors ${darkMode ? 'dark' : ''}`} style={{backgroundColor: darkMode ? '#0f172a' : 'white', color: darkMode ? '#e5e7eb' : '#111827'}}>
      <Header darkMode={darkMode} onDarkModeToggle={() => setDarkMode(!darkMode)} onNavClick={(page) => {
        if (['gallery', 'pricing', 'location'].includes(page)) {
          scrollToSection(page);
        } else {
          setActivePage(page);
        }
      }} />
      {pages[activePage] && pages[activePage]()}
      <Footer listing={listing} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
